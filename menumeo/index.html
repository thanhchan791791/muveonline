<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Hoàng Thượng - Cherrypet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800;900&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        .title-cute {
            font-family: 'Grandstander', 'Nunito', cursive, sans-serif;
            background: linear-gradient(135deg, #FF4565, #FF8DA1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(255, 141, 161, 0.3));
        }

        /* Gradient Background Theme */
        body {
            background: linear-gradient(135deg, #FFE4E1 0%, #FFFDD0 35%, #FFB6C1 70%, #E6E6FA 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.25), 0 4px 12px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .glass-card:active {
            transform: scale(0.95);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        /* Floating Background Elements */
        .bg-floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Pudding Jump Animation */
        @keyframes puddingJump {
            0% { transform: scale(1, 1); }
            30% { transform: scale(1.12, 0.88); }
            40% { transform: scale(0.88, 1.12); }
            50% { transform: scale(1.06, 0.94); }
            65% { transform: scale(0.97, 1.03); }
            75% { transform: scale(1.02, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .animate-pudding {
            animation: puddingJump 0.5s ease-in-out;
        }

        /* Floating Bounce Animation cho chữ nhấp nhô */
        @keyframes floatBounce {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-8px) scale(1.05);
            }
        }

        .animate-float-text {
            animation: floatBounce 1.5s infinite ease-in-out;
        }

        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Tag pill scroll styling */
        .filter-chip {
            transition: all 0.25s ease;
        }
        .filter-chip.active {
            background: linear-gradient(135deg, #FF8DA1, #FFB6C1);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 141, 161, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="relative text-gray-800">

    <div id="bgContainer" class="bg-floating-container"></div>

                            Menu Hoàng Thượng

            </div>

                    X
                </button>
            </div>

            <!-- Tags Filter Horizontal Scroll -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 text-xs font-semibold">
                <button onclick="setFilter('all', this)" class="filter-chip active px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">

                <button onclick="setFilter('Ăn ảnh', this)" class="filter-chip px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">

                <button onclick="setFilter('Ngoan ngoãn', this)" class="filter-chip px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">
                    Dịu dàng

                <button onclick="setFilter('Thèm ăn', this)" class="filter-chip px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">
                    Thèm ăn
                </button>
                <button onclick="setFilter('Ham ăn', this)" class="filter-chip px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">
                    Ham ăn

                <button onclick="setFilter('Làm biếng', this)" class="filter-chip px-3.5 py-1.5 rounded-full bg-white/80 text-gray-600 whitespace-nowrap shadow-sm border border-white/90">
                    Làm biếng
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3.5 relative z-10">
        <!-- Banner Mini Announcement -->
        <div class="bg-gradient-to-r from-amber-100/90 to-pink-100/90 backdrop-blur-md p-3 rounded-2xl mb-4 border border-amber-200/60 shadow-sm flex items-center gap-3">
            <div class="text-xs text-amber-900">

            </div>
        </div>

        <!-- Cats Grid Container (2 Columns on Mobile) -->
        <div id="catsGrid" class="grid grid-cols-2 gap-3">

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">

            <p class="text-xs text-gray-400 mt-1">Hãy thử tìm từ khóa khác xem sao nhé.</p>

    <!-- Detail Modal Popup -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-sm transition-opacity duration-300">
        <div class="glass-modal w-full max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden max-h-[90vh] flex flex-col transform transition-all duration-300 translate-y-full sm:translate-y-0" id="detailModalContent">
            
            <!-- Top Image & Close Button -->
            <div class="relative h-72 sm:h-80 w-full bg-gray-900 overflow-hidden" id="modalImgContainer">
                <!-- Background mờ -->

                <!-- Close Button -->
                <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-black/40 text-white backdrop-blur-md flex items-center justify-center hover:bg-black/60 transition-colors font-bold text-sm">
                    X

                <div>

                    <p id="modalCatDesc" class="text-gray-600 mt-2 leading-relaxed text-sm">Mô tả tính cách</p>
                </div>

                <!-- Personality Tags -->

        // State Management
        let currentFilter = 'all';
        let searchQuery = '';

        // Render Cats List
        function renderCats() {
            const grid = document.getElementById('catsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            const filteredCats = catData.filter(cat => {
                const matchesSearch = cat.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     (cat.tags && cat.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase())));
                const matchesFilter = currentFilter === 'all' || (cat.tags && cat.tags.includes(currentFilter));
                return matchesSearch && matchesFilter;
            });

            if (filteredCats.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filteredCats.forEach(cat => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-3xl p-2.5 sm:p-3 relative flex flex-col justify-between cursor-pointer h-full`;
                card.id = `cat-card-${cat.id}`;
                card.onclick = (e) => handleCardClick(e, cat.id);

                // Kiểm tra chữ overlay
                const overlayText = cat.overlayText;
                let overlayHtml = '';
                
                if (overlayText) {
                    const isMacDay = overlayText.toLowerCase() === 'mắc dạy';
                    const borderStyle = isMacDay 
                        ? 'border-2 border-red-500 bg-red-500/20 text-red-200' 
                        : 'border border-white/40 bg-black/40 text-white';

                    overlayHtml = `
                        <div class="absolute top-1/2 left-1/2 animate-float-text z-10 pointer-events-none backdrop-blur-md px-3 py-1 rounded-full ${borderStyle} shadow-lg w-max whitespace-nowrap">
                            <span class="font-extrabold text-xs sm:text-sm tracking-wider uppercase drop-shadow-md">${overlayText}</span>
                        </div>
                    `;
                }

                const tagsHtml = (cat.tags && cat.tags.length > 0) 
                    ? cat.tags.map(tag => `<span class="px-2 py-0.5 bg-pink-100/80 text-pink-600 rounded-md text-[10px] font-bold">${tag}</span>`).join('') 
                    : '';

                card.innerHTML = `
                    <div class="flex flex-col h-full justify-between">
                        <div>
                            <!-- Cat Image Wrapper -->
                            <div class="relative w-full aspect-square rounded-2xl overflow-hidden mb-2.5 shadow-sm bg-gray-100 group">
                                <img src="${cat.image}" alt="${cat.name}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                                ${overlayHtml}
                            </div>

                            <!-- Name -->
                            <div class="px-1 mb-1.5">
                                <h3 class="font-extrabold text-sm sm:text-base text-gray-800 line-clamp-1">${cat.name}</h3>
                            </div>
                        </div>

                        <!-- Tính cách (Tags) -->
                        <div class="px-1 flex flex-wrap gap-1 mt-auto">
                            ${tagsHtml}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Handle Click on Cat Card
        function handleCardClick(e, id) {
            const card = document.getElementById(`cat-card-${id}`);
            if (card) {
                card.classList.remove('animate-pudding');
                void card.offsetWidth; // Trigger reflow
                card.classList.add('animate-pudding');
            }

            setTimeout(() => {
                openDetailModal(id);
            }, 150);
        }

        // Filtering & Search
        function filterCats() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim();
            
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderCats();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderCats();
        }

        function setFilter(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            btn.classList.add('active');
            renderCats();
        }

        // Modal Detail Handling
        function openDetailModal(id) {
            const cat = catData.find(c => c.id === id);
            if (!cat) return;

            document.getElementById('modalCatImg').src = cat.image;
            document.getElementById('modalCatImgBg').src = cat.image;
            document.getElementById('modalCatName').innerText = cat.name;
            document.getElementById('modalCatDesc').innerText = cat.desc;

            // Xử lý chữ nhấp nhô overlay trong modal phóng to
            const modalImgContainer = document.getElementById('modalImgContainer');
            const existingOverlay = modalImgContainer.querySelector('.modal-floating-overlay');
            if (existingOverlay) existingOverlay.remove();

            if (cat.overlayText) {
                const isMacDay = cat.overlayText.toLowerCase() === 'mắc dạy';
                const borderStyle = isMacDay 
                    ? 'border-2 border-red-500 bg-red-500/20 text-red-200' 
                    : 'border border-white/40 bg-black/40 text-white';

                const modalOverlay = document.createElement('div');
                modalOverlay.className = `modal-floating-overlay absolute top-1/2 left-1/2 animate-float-text z-10 pointer-events-none backdrop-blur-md px-4 py-1.5 rounded-full ${borderStyle} shadow-xl w-max whitespace-nowrap`;
                modalOverlay.innerHTML = `<span class="font-black text-sm sm:text-base tracking-wider uppercase drop-shadow-md">${cat.overlayText}</span>`;
                modalImgContainer.appendChild(modalOverlay);
            }

            const tagsContainer = document.getElementById('modalCatTags');
            tagsContainer.innerHTML = (cat.tags && cat.tags.length > 0) 
                ? cat.tags.map(t => `<span class="px-3 py-1 bg-pink-100 text-pink-600 rounded-lg text-xs font-bold">${t}</span>`).join('')
                : '';

            const modal = document.getElementById('detailModal');
            const modalContent = document.getElementById('detailModalContent');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const modalContent = document.getElementById('detailModalContent');
            
            modalContent.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 250);
        }

        window.onload = function() {
            renderCats();
        };
    </script>
</body>
</html>
