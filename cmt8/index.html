<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản lý Menu iOS Style</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.4);
            --primary-color: #007aff;
            --danger-color: #ff3b30;
            --text-color: #1c1c1e;
            --secondary-text: #8e8e93;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* iOS Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(242, 242, 247, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        /* Controls Area (Search & Language) */
        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background: rgba(118, 118, 128, 0.12);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-color);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            background: rgba(118, 118, 128, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text);
            font-size: 14px;
            pointer-events: none;
        }

        .lang-picker {
            display: flex;
            background: rgba(118, 118, 128, 0.12);
            padding: 2px;
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn.active {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        /* iOS Card Item */
        .category-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: -0.1px;
            margin: 20px 0 8px 12px;
        }

        .menu-list {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
            transition: background 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .item-card:last-child {
            border-bottom: none;
        }

        .item-card:active {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(0.98);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .item-id {
            font-size: 12px;
            color: var(--secondary-text);
        }

        .item-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .action-btn:active {
            transform: scale(0.85);
        }

        .edit-btn { background: rgba(0, 122, 255, 0.1); color: var(--primary-color); }
        .delete-btn { background: rgba(255, 59, 48, 0.1); color: var(--danger-color); }

        /* Floating Action Button (FAB) */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 90;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* Modal Sheets (iOS Style Bottom Sheet) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--secondary-text);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #f2f2f7;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Quản lý Menu</h1>
        <div class="controls-bar">
            <!-- Cụm nút ngôn ngữ VI EN nằm bên trái -->
            <div class="lang-picker">
                <button class="lang-btn active" onclick="switchLang('vi', event)">VI</button>
                <button class="lang-btn" onclick="switchLang('en', event)">EN</button>
            </div>
            <!-- Ô tìm kiếm nằm bên phải -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm món..." oninput="renderMenu()">
            </div>
        </div>
    </header>

    <div class="container" id="menu-container">
        <!-- Render danh sách menu tại đây -->
    </div>

    <!-- Nút Thêm Món (FAB) -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Modal iOS Bottom Sheet (Thêm/Sửa Món) -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Thêm món mới</span>
                <button class="action-btn delete-btn" onclick="closeModal()">✕</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="editType"> <!-- 'drinks' hoặc 'food' -->
                <input type="hidden" id="categoryIdx">
                <input type="hidden" id="itemIdx">

                <div class="form-group">
                    <label>Loại danh mục</label>
                    <select id="typeSelect" class="form-control" onchange="updateCategorySelect()">
                        <option value="drinks">Đồ uống (Drinks)</option>
                        <option value="food">Thức ăn (Food)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Danh mục (Category)</label>
                    <select id="categorySelect" class="form-control"></select>
                </div>

                <div class="form-group">
                    <label>Mã món (ID)</label>
                    <input type="text" id="itemId" class="form-control" placeholder="Ví dụ: cf6" required>
                </div>

                <div class="form-group">
                    <label>Tên món</label>
                    <input type="text" id="itemName" class="form-control" placeholder="Tên món..." required>
                </div>

                <div class="form-group">
                    <label>Giá tiền (VNĐ)</label>
                    <input type="number" id="itemPrice" class="form-control" placeholder="40000" required>
                </div>

                <button type="submit" class="btn-submit">Lưu lại</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAV7r-rjXo6U62LX1AA7c7DAHb8GhOOOsg",
            authDomain: "saigon-dalat.firebaseapp.com",
            databaseURL: "https://saigon-dalat-default-rtdb.firebaseio.com",
            projectId: "saigon-dalat",
            storageBucket: "saigon-dalat.firebasestorage.app",
            messagingSenderId: "339735183485",
            appId: "1:339735183485:web:bc23cd740104d272577114"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // State dữ liệu
        let currentLang = 'vi';
        let menuData = { vi: { food: [], drinks: [] }, en: { food: [], drinks: [] } };

        // Lắng nghe dữ liệu thời gian thực
        const menuRef = ref(database, 'branch2_menu');
        onValue(menuRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                menuData = data;
                renderMenu();
            }
        });

        // Hàm chuẩn hóa chuỗi (Bỏ dấu tiếng Việt, chuyển chữ thường, xóa khoảng trắng)
        function normalizeString(str) {
            if (!str) return '';
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .replace(/Đ/g, "d")
                .replace(/\s+/g, "");
        }

        // Hàm render Menu
        window.renderMenu = function() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const searchInput = document.getElementById('searchInput');
            const keyword = searchInput ? normalizeString(searchInput.value) : '';

            const langData = menuData[currentLang] || { food: [], drinks: [] };

            ['drinks', 'food'].forEach(type => {
                const categories = langData[type] || [];
                categories.forEach((cat, catIdx) => {
                    if (!cat.drinks || cat.drinks.length === 0) return;

                    // Lọc danh sách món dựa trên từ khóa tìm kiếm (Tên món hoặc ID món)
                    const filteredDrinks = cat.drinks.map((item, itemIdx) => ({ item, itemIdx })).filter(({ item }) => {
                        const normName = normalizeString(item.name);
                        const normId = normalizeString(item.id);
                        return normName.includes(keyword) || normId.includes(keyword);
                    });

                    if (filteredDrinks.length === 0) return;

                    const catTitle = document.createElement('div');
                    catTitle.className = 'category-title';
                    catTitle.innerText = cat.categoryName;
                    container.appendChild(catTitle);

                    const listContainer = document.createElement('div');
                    listContainer.className = 'menu-list';

                    filteredDrinks.forEach(({ item, itemIdx }) => {
                        const card = document.createElement('div');
                        card.className = 'item-card';
                        card.innerHTML = `
                            <div class="item-info">
                                <span class="item-name">${item.name}</span>
                                <span class="item-id">ID: ${item.id}</span>
                            </div>
                            <div class="item-actions">
                                <span class="item-price">${item.price.toLocaleString('vi-VN')} đ</span>
                                <button class="action-btn edit-btn" onclick="openModal('${type}', ${catIdx}, ${itemIdx})">✎</button>
                                <button class="action-btn delete-btn" onclick="deleteItem('${type}', ${catIdx}, ${itemIdx})">✕</button>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });

                    container.appendChild(listContainer);
                });
            });
        };

        // Chuyển đổi Ngôn ngữ
        window.switchLang = function(lang, evt) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
            renderMenu();
        };

        // Xóa Món
        window.deleteItem = function(type, catIdx, itemIdx) {
            if (confirm("Bạn có chắc muốn xóa món này?")) {
                menuData[currentLang][type][catIdx].drinks.splice(itemIdx, 1);
                saveToFirebase();
            }
        };

        // Modal Controls
        window.openModal = function(type = null, catIdx = null, itemIdx = null) {
            const modal = document.getElementById('itemModal');
            const typeSelect = document.getElementById('typeSelect');

            if (type !== null && catIdx !== null && itemIdx !== null) {
                // Mode: Sửa món
                document.getElementById('modalTitle').innerText = 'Chỉnh sửa món';
                document.getElementById('editType').value = type;
                document.getElementById('categoryIdx').value = catIdx;
                document.getElementById('itemIdx').value = itemIdx;

                typeSelect.value = type;
                typeSelect.disabled = true;
                updateCategorySelect(catIdx);

                const item = menuData[currentLang][type][catIdx].drinks[itemIdx];
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemPrice').value = item.price;
            } else {
                // Mode: Thêm mới
                document.getElementById('modalTitle').innerText = 'Thêm món mới';
                document.getElementById('itemForm').reset();
                document.getElementById('editType').value = '';
                typeSelect.disabled = false;
                updateCategorySelect();
            }

            modal.classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('itemModal').classList.remove('active');
        };

        window.updateCategorySelect = function(selectedCatIdx = 0) {
            const type = document.getElementById('typeSelect').value;
            const categorySelect = document.getElementById('categorySelect');
            categorySelect.innerHTML = '';

            const categories = menuData[currentLang][type] || [];
            categories.forEach((cat, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.innerText = cat.categoryName;
                if (idx == selectedCatIdx) option.selected = true;
                categorySelect.appendChild(option);
            });
        };

        // Submit Form (Thêm / Sửa)
        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const editType = document.getElementById('editType').value;
            const type = document.getElementById('typeSelect').value;
            const catIdx = parseInt(document.getElementById('categorySelect').value);
            const itemIdx = document.getElementById('itemIdx').value;

            const newItem = {
                id: document.getElementById('itemId').value,
                name: document.getElementById('itemName').value,
                price: Number(document.getElementById('itemPrice').value)
            };

            if (editType) {
                // Cập nhật
                menuData[currentLang][type][catIdx].drinks[parseInt(itemIdx)] = newItem;
            } else {
                // Thêm mới
                if (!menuData[currentLang][type][catIdx].drinks) {
                    menuData[currentLang][type][catIdx].drinks = [];
                }
                menuData[currentLang][type][catIdx].drinks.push(newItem);
            }

            saveToFirebase();
            closeModal();
        });

        // Đồng bộ dữ liệu lên Firebase
        function saveToFirebase() {
            set(ref(database, 'branch2_menu'), menuData)
                .then(() => renderMenu())
                .catch((error) => alert("Lỗi khi lưu dữ liệu: " + error.message));
        }

        // Khởi tạo các danh mục ban đầu cho Select modal
        updateCategorySelect();
    </script>
</body>
</html>
